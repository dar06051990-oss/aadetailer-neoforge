name: Check ADetailer PR 2 cleanup
on: push
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.9.9 pytest
      - name: Original findings
        run: ruff check aaaaaa/anima_reference.py aaaaaa/inpaint_size.py tests/test_anima_reference.py tests/test_inpaint_size.py || true
      - name: Safe cleanup and remaining findings
        run: |
          ruff check --fix aaaaaa/anima_reference.py aaaaaa/inpaint_size.py tests/test_anima_reference.py tests/test_inpaint_size.py || true
          ruff format aaaaaa/anima_reference.py aaaaaa/inpaint_size.py tests/test_anima_reference.py tests/test_inpaint_size.py
          ruff check aaaaaa/anima_reference.py aaaaaa/inpaint_size.py tests/test_anima_reference.py tests/test_inpaint_size.py || true
          git diff -- aaaaaa/anima_reference.py aaaaaa/inpaint_size.py tests/test_anima_reference.py tests/test_inpaint_size.py
          ruff check 'scripts/!adetailer.py' || true
      - run: python -m pytest -q tests/test_anima_reference.py tests/test_inpaint_size.py
